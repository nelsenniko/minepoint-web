
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101912">
  <title>MinePoint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>⛏️ MINEPOINT</h1>
        <p>PLAY · MINE · EARN</p>
      </div>
      <span aria-hidden="true">🧑🏻‍🚀</span>
    </header>

    <section class="card">
      <p>PEMAIN</p>
      <h2 id="playerName">Memeriksa Telegram...</h2>
      <p id="connectionStatus">Menunggu autentikasi</p>
    </section>

    <section class="card">
      <p>🪙 SALDO PTS</p>
      <h2 id="balance">0</h2>
      <p>Poin permainan MinePoint</p>
    </section>

    <section class="card mining-card">
      <h2>⛏️ MINING</h2>
      <p>Hadiah per sesi: <strong>100 PTS</strong></p>
      <p>Durasi: <strong>12 jam</strong></p>

      <div id="miningTimer" class="timer">12:00:00</div>
      <p id="miningStatus">Memuat status mining...</p>

      <button id="startBtn" type="button" disabled>
        Mulai Mining
      </button>

      <button id="claimBtn" type="button" disabled>
        Klaim Reward
      </button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>

    <footer>
      PTS adalah poin permainan, bukan token kripto.
    </footer>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
