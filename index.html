
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>MinePoint</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo">⛏️</div>
      <div>
        <h1>MINEPOINT</h1>
        <p>PLAY · MINE · EARN</p>
      </div>
    </header>

    <section class="card user-card">
      <div class="label">PEMAIN</div>
      <h2 id="playerName">Memeriksa Telegram...</h2>
      <p id="connectionStatus">Menghubungkan ke server...</p>
    </section>

    <section class="card balance-card">
      <div class="label">SALDO PTS</div>
      <div class="balance" id="balance">0</div>
      <p>Poin permainan MinePoint</p>
    </section>

    <section class="card mining-card">
      <div class="label">⛏️ PENAMBANGAN</div>

      <div class="reward">
        <span>Reward per sesi</span>
        <strong>100 PTS</strong>
      </div>

      <div class="reward">
        <span>Durasi</span>
        <strong>12 jam</strong>
      </div>

      <div class="timer" id="miningTimer">12:00:00</div>
      <p class="mining-status" id="miningStatus">
        Memeriksa status penambangan...
      </p>

      <button id="startButton" type="button" disabled>
        Memuat...
      </button>

      <button id="claimButton" type="button" disabled>
        Klaim Reward
      </button>
    </section>

    <div id="message" class="message" role="status" aria-live="polite" hidden></div>

    <footer>
      MinePoint · Poin permainan internal
    </footer>
  </main>
</body>
</html>
